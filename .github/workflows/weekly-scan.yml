# ============================================================================
#  THE CRAWL PRICE INDEX — fully automated weekly refresh
# ----------------------------------------------------------------------------
#  Runs on GitHub's machines on a schedule. Scans the web, rebuilds the site
#  data, and commits — which triggers Cloudflare to auto-deploy. You do nothing.
#
#  The rebuild step has a safety gate: if a scan comes back thin (rate-limited
#  or a bad run), it refuses to publish and the existing live data is kept.
#  So an automated run can never degrade your live site.
# ============================================================================
name: Weekly crawl scan

on:
  schedule:
    # Every Monday 06:00 UTC. (min hour day month weekday)
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # also lets you trigger it by hand from the Actions tab

permissions:
  contents: write          # allow the job to commit the refreshed data back

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the scan (conservative size for cloud IPs)
        run: node scan.cjs --top 2000
        continue-on-error: true   # a failed/thin scan must not fail the job

      - name: Rebuild site data (aborts safely if scan is thin)
        id: rebuild
        run: |
          if node rebuild.cjs; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
            echo "Scan looked thin — keeping existing live data. Not an error."
          fi

      - name: Commit refreshed data
        if: steps.rebuild.outputs.published == 'yes'
        run: |
          git config user.name  "crawl-price-index-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.json index.html world.html scan-robots.csv scan-signals.csv scan-summary.json
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly scan $(date -u +%Y-%m-%d)"
            git push
          fi
